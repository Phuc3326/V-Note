services:
  # ==========================================
  # 1. Cơ sở dữ liệu PostgreSQL
  # ==========================================
  vnote-db:
    image: postgres:16-alpine
    container_name: vnote-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vnote_db}
      POSTGRES_USER: ${DB_USER:-vnote_user}
      POSTGRES_PASSWORD: ${DB_PASS:-VnoteSecret2026!}
    ports:
      - "5435:5432"
    volumes:
      - vnote_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vnote_user} -d ${POSTGRES_DB:-vnote_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Ứng dụng Web Java Tomcat V-Note
  # ==========================================
  vnote-app:
    build: .
    container_name: vnote-webapp
    restart: always
    depends_on:
      vnote-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://vnote-db:5432/${POSTGRES_DB:-vnote_db}
      DB_USER: ${DB_USER:-vnote_user}
      DB_PASS: ${DB_PASS:-VnoteSecret2026!}
      BREVO_API_KEY: ${BREVO_API_KEY}
      EMAIL_USER: ${EMAIL_USER}

# ==========================================
# Ổ cứng độc lập (Named Volume) lưu trữ Data
# ==========================================
volumes:
  vnote_pgdata:
